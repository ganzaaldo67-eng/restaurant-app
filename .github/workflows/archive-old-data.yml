name: Archive Old Data

on:
  schedule:
    - cron: '0 4 1 * *'   # 1st of every month at 04:00 UTC
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          # cache: 'npm'

      - name: Verify Node version
        run: node --version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run archive script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/archive-old-data.js

      - name: Commit and push archive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only try to add if the archives folder exists
          if [ -d "archives" ]; then
            git add archives/
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore: archive old data $(date +%Y-%m-%d)"
              git push
            fi
          else
            echo "No archives folder found — nothing to commit"
          fi
